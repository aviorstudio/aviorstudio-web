[tools]
"python" = "3.13.11"
"bun" = "1.4.1"
"node" = "24.18.1"

[env]
"TOOLS_ROOT" = "{{ get_env(name='TOOLS_ROOT', default=config_root ~ '/.ci-tools') }}"
"GOTOOLCHAIN" = "local"
"PYTHONDONTWRITEBYTECODE" = "1"

[tasks."install"]
run = ["bun install --frozen-lockfile"]

[tasks."build"]
run = "python3 \"$TOOLS_ROOT/helpers/verification.py\" build --name build --artifact dist -- mise run _build"
depends = ["install"]

[tasks."artifact-check"]
run = ["python3 scripts/check-output.py"]
depends = ["build"]

[tasks."dev"]
run = ["bun run dev"]

[tasks."clean"]
run = ["bun -e 'const fs=require('\"'\"'node:fs'\"'\"');for(const p of ['\"'\"'dist'\"'\"','\"'\"'.astro'\"'\"'])fs.rmSync(p,{recursive:true,force:true})'"]

[tasks."lint"]
run = ["bun x --no-install biome check", "bun run typecheck"]

[tasks."check"]
run = [{"task" = "install"}, {"task" = "lint"}, {"task" = "build"}, {"task" = "artifact-check"}]

[tasks."_build"]
run = ["bun run build"]
hide = true
