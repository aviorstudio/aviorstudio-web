# Keeps the pinned `uses:` refs in .github/workflows and .github/actions current.
#
# Every third-party action here is pinned to a commit SHA rather than a tag,
# which is the point: a tag is a moving reference, and whoever can move it can
# run code in these jobs. The cost of a SHA is that nothing tells you when it
# has gone stale -- a tag at least reads as a version. This is the thing that
# tells you.
#
# No groups: the shared gate (scripts/engineering/helpers/dependency-policy.py)
# never passes a grouped update -- several dependencies cannot be judged as one
# routine change -- so a group would only sit waiting for review. One pull
# request per dependency keeps each merge attributable; major updates remain
# their own reviewable pull requests either way.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
