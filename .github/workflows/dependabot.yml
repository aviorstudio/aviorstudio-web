name: Dependabot

# Thin caller: the gate body is the shared reusable workflow in nicodes/tools,
# pinned by full commit SHA. The policy scripts it runs come from this
# shared workflow's independently pinned helper checkout -- never the
# PR head. This site deploys via Vercel
# and has no cd.yml, so merged-main coverage is dispatched onto ci.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# The called workflow can only downgrade these, never elevate them; omitting
# the block would fall back to the repository's read-only default.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    uses: nicodes/tools/.github/workflows/dependabot.yml@7ef549c75cfb7ac4e30ad68cabeb1b0e03e3f509 # v0.9.2
    with:
      dispatch-target: ci.yml
