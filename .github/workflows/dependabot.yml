name: Dependabot

# Thin caller: the gate body is the shared reusable workflow in nicodes/cicd,
# pinned by full commit SHA. The policy scripts it runs come from this
# repository's vendored scripts/engineering/helpers/ at the pull request's
# protected base SHA -- never from the PR head. This site deploys via Vercel
# and has no cd.yml, so merged-main coverage is dispatched onto ci.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# The called workflow can only downgrade these, never elevate them; omitting
# the block would fall back to the repository's read-only default.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    uses: nicodes/cicd/.github/workflows/dependabot.yml@fade862978fc1a2ba625d9486443aa0e6723f8bf
    with:
      dispatch-target: ci.yml
